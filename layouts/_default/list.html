{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{ if .RegularPages }}
<ul class="post-list">
  {{ range .RegularPages.ByDate.Reverse }}
  <li>
    <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>{{ if .Draft }} · <span class="draft">Draft</span>{{ end }}</p>
  </li>
  {{ end }}
</ul>
{{ else }}
<p class="muted">No posts yet. Stay tuned.</p>
{{ end }}
{{ end }}
