<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.Title }} — Blog" href="{{ "blog/index.xml" | absURL }}">
    {{ $favicon := (resources.Get "images/headshot.jpeg").Resize "64x png" }}
    <link rel="icon" href="{{ $favicon.RelPermalink }}" type="image/png">
    {{ $theme := resources.Get "js/theme.js" | minify | fingerprint }}
    <script src="{{ $theme.RelPermalink }}" integrity="{{ $theme.Data.Integrity }}"></script>
    {{ $css := resources.Get "css/site.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <nav aria-label="Main navigation">
          <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>About</a>
          <a href="{{ "blog/" | relURL }}"{{ if eq .Section "blog" }} aria-current="page"{{ end }}>Blog</a>
          <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" hidden>
            {{ readFile "assets/icons/moon.svg" | replaceRE "<svg " "<svg aria-hidden=\"true\" focusable=\"false\" " | safeHTML }}
            {{ readFile "assets/icons/sun.svg" | replaceRE "<svg " "<svg aria-hidden=\"true\" focusable=\"false\" " | safeHTML }}
          </button>
        </nav>
    </header>
    <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer">{{ partial "social.html" . }}</footer>
  </body>
</html>
