{{ define "main" }}
<article class="about">
  {{ $photo := resources.Get "images/headshot.jpeg" }}
  {{ $photo = $photo.Resize "480x" }}
  <img class="headshot" src="{{ $photo.RelPermalink }}" width="{{ $photo.Width }}" height="{{ $photo.Height }}" alt="Cedric Sirianni">
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
